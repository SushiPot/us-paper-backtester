name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  runtime-safety:
    name: Runtime safety checks
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt

      - name: Run regression tests
        env:
          PYTHONIOENCODING: utf-8
          MARKET_DATA_REQUEST_INTERVAL_SECONDS: "0"
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        env:
          PYTHONIOENCODING: utf-8
        run: python -m compileall -q .

  prediction-research:
    name: Optional prediction research engine
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-prediction-research.txt
      - name: Install optional research dependencies
        run: python -m pip install -r requirements-prediction-research.txt
      - name: Test registered experiments and real LightGBM
        env:
          PYTHONIOENCODING: utf-8
          LOKY_MAX_CPU_COUNT: "2"
        run: python -m unittest discover -s tests -p test_prediction_experiments.py -v
